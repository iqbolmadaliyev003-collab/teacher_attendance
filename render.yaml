# Render Blueprint — https://render.com/docs/blueprint-spec
# GitHub repodagi shu fayl orqali Render'da "New → Blueprint" bilan
# bir bosishda deploy qilish mumkin.
#
# Bu bot Telegram uzun polling bilan ishlaydi (serverni HTTP so'rov
# kutmaydi), shuning uchun Render'da "Background Worker" turi ishlatiladi.
#
# Deploy'dan keyin Render dashboard → Environment → BOT_TOKEN
# ni @BotFather tokenni bilan to'ldiring.

services:
  - type: worker
    name: teacher-attendance-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false          # qiymatni dashboard'da o'zingiz kiritasiz
      - key: PYTHON_VERSION
        value: 3.12.6
    # Davomat tarixi (SQLite baza) qayta deploy'da yo'qolmasligi uchun
    # disk ulash mumkin. Ulashda config env'iga quyidagini qo'shing:
    #   DB_PATH=/data/attendance.db
    # (Pullik rejim talab qiladi — bepul rejimda bu blokni olib tashlang)
    #
    # disk:
    #   name: bot-data
    #   mountPath: /data
    #   sizeGB: 1
